# Model
model_name_or_path: Qwen/Qwen3-4B
run_name: "vpo_maze"
output_dir: data/vpo/qwen3_4b_maze_vpo
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Dataset
dataset_name: json
data_files:
  train: data/maze/train.jsonl
  test: data/maze/test.jsonl
dataset_train_split: train
dataset_test_split: test
eval_sample_size: 100

# Prompt and output format
task_spec: gen
sys_prompt_name: maze_multi_answer
format_pattern: maze_multi_answer
num_candidates: 3

# VPO
enable_vpo: true
vpo_objective_mode: maze
vpo_num_objectives: 4
vpo_num_scalarizations: 8
vpo_dirichlet_alpha: 1.0
vpo_apply_format_gate: true
vpo_apply_uniqueness_gate: false

# Debugging
debug_print_first_maze: true

# Diagnostic reward only
reward_funcs:
  - format
reward_weights:
  - 1.0

# Training
learning_rate: 1.0e-6
lr_scheduler_type: constant
warmup_ratio: 0.0
weight_decay: 0.01
max_grad_norm: 1.0
num_train_epochs: 1
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
steps_per_generation: 256
gradient_accumulation_steps: 256
generation_batch_size: 1024
num_generations: 8
num_iterations: 1
temperature: 1.0
top_p: 1.0
beta: 0.001
epsilon: 0.2
delta: 3.0
scale_rewards: group
loss_type: dapo

max_prompt_length: 4096
max_completion_length: 8192

use_vllm: true
vllm_gpu_memory_utilization: 0.4
vllm_importance_sampling_correction: false

logging_steps: 1
log_completions: true
save_strategy: steps
save_steps: 20
save_total_limit: 1
report_to:
  - wandb
